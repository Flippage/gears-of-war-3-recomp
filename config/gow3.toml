# gow3 settings. scripts\build.ps1 copies this next to gow3.exe only when no gow3.toml is there,
# so edits to the copy next to the exe are kept. Every setting also works on the command line
# (--name=value).

# ---------- Display ----------
# fullscreen = true
# Internal render resolution as a multiple of 1280x720: 1 = 720p, 2 = 1440p, 3 = 4K.
# With DLSS, 1 upscales 720p to the screen (DLSS Performance at 1440p); 2 at 1440p is DLAA.
# resolution_scale = 1

# ---------- GPU ----------
# CPU readback of shader memory exports. On (the runtime default), the CPU waits for the GPU at
# every memexport: measured 28 s of waiting in one 5 s window of a level load and 0.5-1.6 s per
# 5 s in play (D3D12STATS memexport_wait_us). Xenia setups for Gears of War 3 turn it off too.
readback_memexport = false
# Render target path. Unset = ROV on NVIDIA/Intel (patched runtime): exact EDRAM/MSAA emulation,
# meant to fix the black patches on faces. "rtv" = host render targets (the stock runtime's
# choice on NVIDIA, and the Xenia setting) - try it if a surface turns the screen white.
# render_target_path_d3d12 = "rtv"

# ---------- Upscaling (patched SDK DLLs in out\sdk; the gow2_ names come from the Gears 2 port) ----------
# Temporal upscaling: "dlss" (NVIDIA RTX), "fsr4" (Radeon RX 7000/9000), "fsr3", or "off".
# Off until it is calibrated for Gears 3: its camera/motion-vector capture was measured on
# Gears of War 2 and Judgment, and on Gears 3 it smears the picture while turning.
gow2_temporal = false
gow2_upscaler = "off"

# ---------- Diagnostics ----------
# One D3D12STATS line every five seconds in the log: draws skipped while a pipeline compiles
# (draws_pipeline_pending), shaders translated on the draw thread (shaders_sync), memexport waits.
d3d12_stats_log = true

# ---------- Game fixes (tools\patch_game_patches.py; restart after changing) ----------
# Community patches: the Gears of War 2 "Black Shading Fix" (illusion, boma), located in Gears 3 by
# hand, and xenia-canary/game-patches "4D5308AB - Gears of War 3" for this disc. The defaults follow
# your Xenia selection for this game.
gow3_black_shading_fix = true       # GUseTilingMode = FALSE (black blocks in character shadows)
gow3_disable_ao = true              # Disable Ambient Occlusion
gow3_unlock_fps = true              # Unlock FPS (the engine's 30 fps cap)
gow3_disable_motion_blur = true     # Disable Motion Blur (ghosting when panning)
gow3_disable_lens_flares = true     # Disable Lens Flares
gow3_disable_bloom = true           # Disable Bloom
gow3_aniso16 = true                 # 16x Anisotropic Filtering
gow3_resolution_scaling_fix = true  # Resolution Scaling Fix / Disable All Post-Processing (changes the look)
gow3_disable_dof = false            # Disable Depth of Field
gow3_occlusion_query_fix = false    # Occlusion Query Fix (less geometry popping)
# Texture streaming pool in MB (the game's own is 145, 0 keeps it; the Gears 2 port uses 196).
# Bigger = fewer textures evicted and reloaded while moving through a level.
gow3_texture_pool_mb = 196
# Performance Patch Option B (Smart Shadow Cuts; your Xenia choice): caps per-object shadow draws and
# skips the pre-allocated shadow caching that misbehaves on NVIDIA. Try it against the black skin patches.
gow3_shadow_perf_b = true
# No dynamic shadows at all (test switch: if the black patches go away with this, they are shadow artifacts).
gow3_disable_dynamic_shadows = false
